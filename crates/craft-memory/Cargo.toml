[package]
name = "craft-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
crypto = [
    "dep:aes-gcm",
    "dep:x25519-dalek",
    "dep:sha2",
    "dep:rand",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto dependencies (optional)
aes-gcm = { version = "0.10", optional = true, features = ["std"] }
x25519-dalek = { version = "2.0", optional = true, features = ["static_secrets"] }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.40", optional = true, features = ["rt", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
criterion = { version = "0.5" }

[[bench]]
name = "sync_benchmark"
harness = false
required-features = ["crypto"]

[lints]
workspace = true
