<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFT Web Dashboard</title>
    <meta name="description" content="Visual harness composition and memory inspection interface for CRAFT">
    
    <!-- Base styles -->
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Selection color */
        ::selection {
            background-color: rgba(233, 69, 96, 0.3);
            color: #e0e0e0;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #16213e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }
        
        /* Focus styles */
        :focus-visible {
            outline: 2px solid #e94560;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- WebAssembly module will be loaded here by wasm-pack -->
    <script type="module">
        import init from './craft_web_ui.js';
        init().catch(console.error);
    </script>
</body>
</html>
