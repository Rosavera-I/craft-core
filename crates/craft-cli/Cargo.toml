[package]
name = "craft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "craft"
path = "src/main.rs"

[dependencies]
craft-core = { path = "../craft-core" }
craft-lsp = { path = "../craft-lsp" }
craft-manifest = { path = "../craft-manifest" }
craft-memory = { path = "../craft-memory" }
craft-registry = { path = "../craft-registry" }
clap = "4.0"
clap_complete = "4.5"
dialoguer = "0.11"
indicatif = "0.17"
flate2 = "1.0"
reqwest = { version = "0.12", features = ["multipart", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
tokio = { version = "1.0", features = ["rt-multi-thread"] }
toml = "0.8"

[lints]
workspace = true
