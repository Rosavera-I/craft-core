[workspace]
resolver = "3"
members = [
    "crates/craft-cli",
    "crates/craft-core",
    "crates/craft-manifest",
    "crates/craft-memory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JMoak/craft-core"
authors = ["JMoak"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
